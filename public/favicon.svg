<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rt-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
  </defs>
  <!-- Fundo escuro automotivo arredondado -->
  <rect width="64" height="64" rx="16" fill="#080A0D"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38B6FF" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Círculo decorativo tecnológico -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#38B6FF" stroke-width="1.5" stroke-dasharray="8 4" stroke-opacity="0.5"/>

  <!-- Letra R em branco puro -->
  <text
    x="22" y="42"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="28"
    text-anchor="middle"
    fill="#FFFFFF"
  >R</text>

  <!-- Letra T em azul elétrico -->
  <text
    x="42" y="42"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="28"
    text-anchor="middle"
    fill="#38B6FF"
  >T</text>
</svg>
